/* required styles */

@keyframes slideUp{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}

.leaflet-container{font-family:'Nunito',sans-serif!important}
.leaflet-control-zoom{margin-bottom:80px!important;margin-right:12px!important}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:18px!important;

  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  padding:10px 16px;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.progress-track{flex:1;height:8px;background:#E5E5E5;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:#58CC02;transition:width .4s ease}
.progress-text{font-size:13px;font-weight:800;color:#6F7B82;white-space:nowrap}

.q-pill{position:fixed;top:68px;left:12px;right:12px;z-index:200;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  padding:14px 20px;border-radius:16px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.25);animation:slideUp .3s ease-out}
.q-pill .q-text{font-size:19px;font-weight:800;line-height:1.3}

.mc-sheet{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
  border-top:1px solid rgba(0,0,0,.08);
  padding:16px max(16px,env(safe-area-inset-left,0px));
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  animation:slideUp .3s ease-out}
.mc-btn{border:2px solid #E5E5E5;background:#FFFFFF;color:#3C3C3C;
  font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;
  padding:13px 18px;border-radius:14px;cursor:pointer;text-align:left;
  width:100%;transition:all .15s;-webkit-tap-highlight-color:transparent}
.mc-btn:active{transform:scale(.98)}
.mc-correct{border-color:#58CC02!important;background:rgba(88,204,2,.15)!important}
.mc-wrong{border-color:#FF4B4B!important;background:rgba(255,75,75,.15)!important}

.learn-sheet{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
  border-top:1px solid rgba(0,0,0,.08);
  border-radius:24px 24px 0 0;
  padding:24px max(20px,env(safe-area-inset-left,0px));
  padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  animation:slideUp .35s ease-out;max-height:45vh;overflow-y:auto}

.green-btn{background:#58CC02;color:#fff;border:none;border-bottom:4px solid #46A302;
  font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;
  padding:14px 32px;border-radius:14px;cursor:pointer;transition:all .15s;width:100%;
  -webkit-tap-highlight-color:transparent}
.green-btn:active{border-bottom-width:2px;transform:translateY(2px)}
.ghost-btn{background:transparent;color:#6F7B82;border:2px solid #E5E5E5;
  font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;
  padding:12px 24px;border-radius:14px;cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent}
.ghost-btn:active{border-color:#58CC02;color:#58CC02}

.lesson-card{background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-radius:16px;
  padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;
  border:2px solid #E5E5E5;transition:all .15s;-webkit-tap-highlight-color:transparent}
.lesson-card:active{transform:scale(.98)}
.lesson-card.locked{opacity:.45;cursor:default}
.lesson-card.selected{border-color:#58CC02;background:#EEF9E3}

.floating-stats{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;z-index:150;
  display:flex;justify-content:space-between;pointer-events:none}
.stat-pill{pointer-events:auto;display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  padding:7px 14px;border-radius:20px;font-size:14px;font-weight:800;
  box-shadow:0 2px 12px rgba(0,0,0,.2)}

.reset-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;animation:popIn .2s ease-out}
.reset-box{background:#FFFFFF;border-radius:20px;padding:28px 24px;max-width:320px;width:90%;text-align:center}
</style>
